name: Update open tasks

on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: tasks-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test marker boundaries and rendering
        run: node --test test/render.test.mjs
      - name: Fetch and render public tasks
        id: render
        run: node scripts/render.mjs
      - name: Commit changed README
        if: steps.render.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          git add -- README.md
          if git diff --cached --quiet -- README.md; then
            echo 'No diff; skipped commit.'
            exit 0
          fi
          git config user.name 'ShadowHarness'
          git config user.email 'contact@shadowharness.com'
          git commit -m 'Update open tasks in README'
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Report unchanged README
        if: steps.render.outputs.changed != 'true'
        run: echo 'No diff; commit and push skipped.'
